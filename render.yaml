services:
  - type: web
    name: recipe-organizer
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # One worker on purpose: the per-visitor rate limit is kept in memory.
    startCommand: gunicorn --chdir src app:app --workers 1 --threads 4 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        sync: false          # paste your Neon connection string in the Render dashboard
      - key: FLASK_SECRET_KEY
        sync: false          # required: a long random value that signs the log-in cookie
      - key: ANTHROPIC_API_KEY
        sync: false          # optional; without it recipes are saved for manual entry
      - key: WRITE_LIMIT_PER_MINUTE
        value: "60"
      - key: AUTH_LIMIT_PER_15_MIN
        value: "10"
      - key: DAILY_SIGNUP_LIMIT
        value: "20"
      - key: DAILY_AI_LIMIT
        value: "25"
      - key: MAX_BULK_LINKS
        value: "25"
