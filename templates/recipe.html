<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Recipe - Recipe Organizer</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, system-ui, sans-serif; margin: 0; background: #F0DEE6; color: #2B0A16; }
    header { padding: 20px 32px; background: #FFFFFF; color: #68012D; border-bottom: 1px solid #F0F1F0; display: flex; justify-content: space-between; align-items: center; }
    header h1 { margin: 0; font-size: 24px; font-weight: 400; color: #68012D; }
    header a { color: #8A1A44; text-decoration: none; font-size: 13px; }
    .container { max-width: 760px; margin: 24px auto; padding: 0 24px; }
    .card { background: linear-gradient(160deg, #FFFFFF 0%, #FBEFF3 100%); border: 1px solid #EBC9D6; box-shadow: 0 1px 3px rgba(17, 17, 17, 0.06); border-radius: 10px; padding: 22px; margin-bottom: 20px; }
    input, textarea { padding: 9px; border: 1px solid #EBC9D6; border-radius: 6px; font-size: 13px; width: 100%; background: #fff; color: #2B0A16; font-family: inherit; box-sizing: border-box; margin-bottom: 8px; }
    textarea { min-height: 50px; resize: vertical; }
    button { padding: 10px 18px; border: none; border-radius: 6px; background: #68012D; color: #fff; font-size: 13px; cursor: pointer; font-weight: 500; }
    button:hover { background: #8A1A44; }
    button.small { padding: 4px 10px; font-size: 11px; }
    button.secondary { background: #FBEFF3; color: #68012D; border: 1px solid #EBC9D6; }
    .info-box { background: #F6DCE5; border: 1px solid #EBC9D6; color: #68012D; padding: 10px; border-radius: 6px; font-size: 13px; margin-bottom: 14px; }
    .recipe-title { font-size: 20px; font-weight: 600; margin: 0 0 6px; }
    .recipe-hero-image { width: 100%; max-height: 320px; object-fit: cover; border-radius: 8px; margin-bottom: 16px; display: block; }
    .source-link { font-size: 12px; color: #8A1A44; margin-bottom: 18px; display: block; }
    .section-label { font-size: 12px; font-weight: 600; color: #7C5A67; text-transform: uppercase; letter-spacing: 0.04em; margin: 18px 0 8px; }
    ul.ingredients, ol.directions { padding-left: 20px; margin: 0; }
    ul.ingredients li, ol.directions li { margin-bottom: 6px; font-size: 14px; line-height: 1.5; }
    .ingredient-edit-row, .direction-edit-row { display: flex; gap: 6px; margin-bottom: 6px; }
    .ingredient-edit-row input, .direction-edit-row input { margin-bottom: 0; }
    .remove-line { background: #A8344F; padding: 6px 10px; font-size: 11px; }
    .add-line { background: #FBEFF3; color: #68012D; padding: 6px 12px; font-size: 12px; margin-top: 4px; }
  </style>
</head>
<body>
  <header>
    <h1>Recipe Organizer</h1>
    <nav><a href="/">All recipes</a><a href="/logout" style="margin-left:16px;">Log out</a></nav>
  </header>
  <div class="container">
    <div class="card" id="recipeCard"></div>
  </div>

  <script>
    function esc(value) {
      return String(value ?? '').replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
    }

    const RECIPE_ID = {{ recipe_id }};
    let currentRecipe = null;
    let editMode = false;

    async function loadRecipe() {
      const res = await fetch(`/api/recipes/${RECIPE_ID}`);
      if (!res.ok) {
        document.getElementById('recipeCard').innerHTML = '<p>Recipe not found.</p>';
        return;
      }
      currentRecipe = await res.json();
      render();
    }

    function render() {
      const card = document.getElementById('recipeCard');
      const r = currentRecipe;

      if (editMode) {
        renderEditForm();
        return;
      }

      let html = '';
      if (r.status === 'needs_manual') {
        html += `<div class="info-box">No recipe could be extracted automatically for this one${r.extraction_message ? ': ' + esc(r.extraction_message) : ''}. Add it manually below.</div>`;
      } else if (r.status === 'pending') {
        html += `<div class="info-box">Still waiting on a caption - go back to the list and add one.</div>`;
      }

      if (r.thumbnail_url) {
        html += `<img src="${esc(r.thumbnail_url)}" class="recipe-hero-image" alt="">`;
      }

      html += `<h2 class="recipe-title">${esc(r.title || 'Untitled recipe')}</h2>`;
      html += `<a href="${esc(r.source_url)}" target="_blank" class="source-link">View original on ${esc(r.platform)}</a>`;

      html += '<div class="section-label">Ingredients</div>';
      html += r.ingredients.length
        ? `<ul class="ingredients">${r.ingredients.map((i) => `<li>${esc(i)}</li>`).join('')}</ul>`
        : '<p style="color:#7C5A67;font-size:13px;">None yet.</p>';

      html += '<div class="section-label">Directions</div>';
      html += r.directions.length
        ? `<ol class="directions">${r.directions.map((d) => `<li>${esc(d)}</li>`).join('')}</ol>`
        : '<p style="color:#7C5A67;font-size:13px;">None yet.</p>';

      if (r.caption_raw) {
        html += `<div class="section-label">Original caption</div><p style="font-size:12px;color:#7C5A67;white-space:pre-wrap;">${esc(r.caption_raw)}</p>`;
      }

      html += `<div style="margin-top:20px;"><button onclick="enterEditMode()">Edit</button></div>`;

      card.innerHTML = html;
    }

    function enterEditMode() {
      editMode = true;
      render();
    }

    function renderEditForm() {
      const card = document.getElementById('recipeCard');
      const r = currentRecipe;
      const ingredients = r.ingredients.length ? r.ingredients : [''];
      const directions = r.directions.length ? r.directions : [''];

      let html = `<input type="text" id="editTitle" value="${esc(r.title || '')}" placeholder="Recipe title" />`;

      html += '<div class="section-label">Ingredients</div><div id="ingredientRows">';
      ingredients.forEach((ing) => {
        html += `<div class="ingredient-edit-row"><input type="text" class="ing-input" value="${esc(ing)}" /><button class="remove-line" onclick="removeRow(this)">Remove</button></div>`;
      });
      html += '</div><button class="add-line" onclick="addRow(\'ingredientRows\', \'ing-input\', \'ingredient-edit-row\')">Add ingredient</button>';

      html += '<div class="section-label">Directions</div><div id="directionRows">';
      directions.forEach((dir) => {
        html += `<div class="direction-edit-row"><input type="text" class="dir-input" value="${esc(dir)}" /><button class="remove-line" onclick="removeRow(this)">Remove</button></div>`;
      });
      html += '</div><button class="add-line" onclick="addRow(\'directionRows\', \'dir-input\', \'direction-edit-row\')">Add step</button>';

      html += `<div style="margin-top:20px; display:flex; gap:8px;"><button onclick="saveEdit()">Save</button><button class="secondary" onclick="cancelEdit()">Cancel</button></div>`;

      card.innerHTML = html;
    }

    function addRow(containerId, inputClass, rowClass) {
      const container = document.getElementById(containerId);
      const div = document.createElement('div');
      div.className = rowClass;
      div.innerHTML = `<input type="text" class="${inputClass}" /><button class="remove-line" onclick="removeRow(this)">Remove</button>`;
      container.appendChild(div);
    }

    function removeRow(btn) {
      btn.parentElement.remove();
    }

    async function saveEdit() {
      const title = document.getElementById('editTitle').value.trim();
      if (!title) {
        alert('Enter a title first.');
        return;
      }
      const ingredients = [...document.querySelectorAll('.ing-input')].map((i) => i.value.trim()).filter(Boolean);
      const directions = [...document.querySelectorAll('.dir-input')].map((i) => i.value.trim()).filter(Boolean);

      const res = await fetch(`/api/recipes/${RECIPE_ID}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title, ingredients, directions }),
      });
      const data = await res.json();

      if (!res.ok) {
        alert(data.error || 'Could not save.');
        return;
      }

      currentRecipe = data;
      editMode = false;
      render();
    }

    function cancelEdit() {
      editMode = false;
      render();
    }

    loadRecipe();
  </script>
</body>
</html>
