<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Log in - Recipe Organizer</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, system-ui, sans-serif; background: #8B7099; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 16px; }
    .card { background: #F3F1EA; border-radius: 10px; padding: 32px; width: 100%; max-width: 340px; }
    .app-name { font-size: 12px; color: #6B4F78; margin: 0 0 6px; }
    h1 { font-size: 18px; margin: 0 0 20px; color: #161A1F; }
    label { display: block; font-size: 12px; color: #4A3F50; margin-bottom: 4px; font-weight: 500; }
    input { width: 100%; padding: 10px; margin-bottom: 12px; border: 1px solid #D8C9DC; border-radius: 6px; font-size: 13px; background: #fff; color: #161A1F; }
    button { width: 100%; padding: 10px; border: none; border-radius: 20px; background: #161A1F; color: #fff; font-size: 13px; cursor: pointer; margin-top: 4px; font-weight: 500; }
    button:hover { background: #333; }
    .error-box { background: #F4DEDC; border: 1px solid #DDB3AE; color: #7A2E24; padding: 10px; border-radius: 6px; font-size: 13px; margin-bottom: 12px; }
    .hint { font-size: 11px; color: #8A7E8F; margin: -6px 0 12px; }
    p.switch { text-align: center; font-size: 13px; margin: 16px 0 0; }
    a { color: #6B4F78; }
  </style>
</head>
<body>
  <div class="card">
    <p class="app-name">Recipe Organizer</p>
    <h1>Log in</h1>
    {% if error %}<div class="error-box" role="alert">{{ error }}</div>{% endif %}
    <form method="POST">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" autocomplete="email" required />
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required />
      <button type="submit">Log in</button>
    </form>
    <p class="switch">No account? <a href="/signup">Sign up</a></p>
  </div>
</body>
</html>
