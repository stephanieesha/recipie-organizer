<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign up - Recipe Organizer</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, system-ui, sans-serif; background: #F0DEE6; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 16px; }
    .card { background: linear-gradient(160deg, #FFFFFF 0%, #FBEFF3 100%); border: 1px solid #EBC9D6; box-shadow: 0 1px 3px rgba(17, 17, 17, 0.06); border-radius: 10px; padding: 32px; width: 100%; max-width: 340px; }
    .app-name { font-size: 12px; color: #8A1A44; margin: 0 0 6px; }
    h1 { font-size: 18px; margin: 0 0 20px; color: #2B0A16; }
    label { display: block; font-size: 12px; color: #7C5A67; margin-bottom: 4px; font-weight: 500; }
    input { width: 100%; padding: 10px; margin-bottom: 12px; border: 1px solid #EBC9D6; border-radius: 6px; font-size: 13px; background: #fff; color: #2B0A16; }
    button { width: 100%; padding: 10px; border: none; border-radius: 6px; background: #68012D; color: #fff; font-size: 13px; cursor: pointer; margin-top: 4px; font-weight: 500; }
    button:hover { background: #8A1A44; }
    .error-box { background: #F4DEDC; border: 1px solid #DDB3AE; color: #7A2E24; padding: 10px; border-radius: 6px; font-size: 13px; margin-bottom: 12px; }
    .hint { font-size: 11px; color: #7C5A67; margin: -6px 0 12px; }
    p.switch { text-align: center; font-size: 13px; margin: 16px 0 0; }
    a { color: #8A1A44; }
  </style>
</head>
<body>
  <div class="card">
    <p class="app-name">Recipe Organizer</p>
    <h1>Create your account</h1>
    {% if error %}<div class="error-box" role="alert">{{ error }}</div>{% endif %}
    <form method="POST">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" autocomplete="email" required />
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="new-password" minlength="8" required />
      <p class="hint">At least 8 characters.</p>
      <button type="submit">Sign up</button>
    </form>
    <p class="switch">Already have an account? <a href="/login">Log in</a></p>
  </div>
</body>
</html>
