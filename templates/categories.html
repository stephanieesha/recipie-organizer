<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Categories - Recipe Organizer</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, system-ui, sans-serif; margin: 0; background: #F0DEE6; color: #2B0A16; }
    header { padding: 20px 32px; background: #FFFFFF; color: #68012D; border-bottom: 1px solid #F0F1F0; display: flex; justify-content: space-between; align-items: center; }
    header h1 { margin: 0; font-size: 24px; font-weight: 400; color: #68012D; }
    header nav a { color: #8A1A44; text-decoration: none; font-size: 13px; margin-left: 16px; }
    .container { max-width: 760px; margin: 24px auto; padding: 0 24px; }
    .card { background: linear-gradient(160deg, #FFFFFF 0%, #FBEFF3 100%); border: 1px solid #EBC9D6; box-shadow: 0 1px 3px rgba(17, 17, 17, 0.06); border-radius: 10px; padding: 22px; margin-bottom: 20px; }
    .card h2 { margin-top: 0; font-size: 20px; font-weight: 400; color: #68012D; }
    .form-row { display: flex; gap: 8px; margin-bottom: 10px; }
    input { padding: 9px; border: 1px solid #EBC9D6; border-radius: 6px; font-size: 13px; flex: 1; background: #fff; color: #2B0A16; }
    button { padding: 10px 18px; border: none; border-radius: 6px; background: #68012D; color: #fff; font-size: 13px; cursor: pointer; font-weight: 500; }
    button:hover { background: #8A1A44; }
    button.danger { background: #A8344F; padding: 5px 10px; font-size: 12px; }
    .error-box { background: #F4DEDC; border: 1px solid #DDB3AE; color: #7A2E24; padding: 10px; border-radius: 6px; font-size: 13px; margin-bottom: 10px; }
    .category-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #EBC9D6; font-size: 14px; }
    .category-name { font-weight: 500; cursor: pointer; }
    .category-name:hover { text-decoration: underline; }
    .category-count { color: #7C5A67; font-size: 12px; }
    .category-actions { display: flex; align-items: center; gap: 12px; }
    .empty-state { color: #7C5A67; font-size: 13px; text-align: center; padding: 20px 0; }
  </style>
</head>
<body>
  <header>
    <h1>Recipe Organizer</h1>
    <nav><a href="/">Recipes</a><a href="/logout">Log out</a></nav>
  </header>
  <div class="container">

    <div class="card">
      <h2>Add a category</h2>
      <div id="addMessage"></div>
      <div class="form-row">
        <input type="text" id="nameInput" placeholder="Category name (e.g. Potatoes, Desserts)" onkeydown="if(event.key === 'Enter') addCategory()" />
        <button onclick="addCategory()">Add</button>
      </div>
    </div>

    <div class="card">
      <h2>Your categories</h2>
      <div id="categoryList"></div>
    </div>

  </div>

  <script>
    function esc(value) {
      return String(value ?? '').replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
    }

    async function loadCategories() {
      const res = await fetch('/api/categories');
      const categories = await res.json();
      const list = document.getElementById('categoryList');

      if (categories.length === 0) {
        list.innerHTML = '<p class="empty-state">No categories yet.</p>';
        return;
      }

      list.innerHTML = categories.map((c) => `
        <div class="category-row">
          <span class="category-name" onclick="window.location.href='/categories/${c.id}'">${esc(c.name)}</span>
          <div class="category-actions">
            <span class="category-count">${c.recipe_count} recipe${c.recipe_count === 1 ? '' : 's'}</span>
            <button class="danger" onclick="removeCategory(${c.id})">Remove</button>
          </div>
        </div>
      `).join('');
    }

    async function addCategory() {
      const messageBox = document.getElementById('addMessage');
      const nameInput = document.getElementById('nameInput');
      messageBox.innerHTML = '';

      if (!nameInput.value.trim()) {
        messageBox.innerHTML = '<div class="error-box">Enter a category name first.</div>';
        return;
      }

      const res = await fetch('/api/categories', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: nameInput.value.trim() }),
      });
      const data = await res.json();

      if (!res.ok) {
        messageBox.innerHTML = `<div class="error-box">${esc(data.error)}</div>`;
        return;
      }

      nameInput.value = '';
      loadCategories();
    }

    async function removeCategory(id) {
      await fetch(`/api/categories/${id}`, { method: 'DELETE' });
      loadCategories();
    }

    loadCategories();
  </script>
</body>
</html>
